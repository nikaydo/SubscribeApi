basePath: /
definitions:
  handlers.Error:
    properties:
      error:
        type: string
    type: object
  models.Id:
    properties:
      id:
        type: integer
    type: object
  models.Subscribe:
    properties:
      end_date:
        type: string
      id:
        type: integer
      price:
        type: integer
      service_name:
        type: string
      start_date:
        type: string
      user_id:
        type: string
    type: object
  models.Summary:
    properties:
      summary:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: CRUDL API for managing subscriptions
  title: Subscriptions API
  version: "1.0"
paths:
  /api/subscribe:
    delete:
      consumes:
      - application/json
      description: Deletes a subscription by its ID.
      parameters:
      - description: Subscription ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Id'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Error'
      summary: Delete a subscription
      tags:
      - subscriptions
    get:
      description: Retrieves subscriptions based on filters
      parameters:
      - description: User ID
        in: query
        name: user_id
        type: string
      - description: Service name
        in: query
        name: service_name
        type: string
      - description: Start date
        in: query
        name: start_date
        type: string
      - description: End date
        in: query
        name: end_date
        type: string
      - description: Include summary
        in: query
        name: summary
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: If summary=true
          schema:
            $ref: '#/definitions/models.Summary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Error'
      summary: Get subscriptions
      tags:
      - subscriptions
    post:
      consumes:
      - application/json
      description: Parses the request body to create a new subscription, validates
        the user ID, and stores the subscription in the database.
      parameters:
      - description: Subscription data
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/models.Subscribe'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Id'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Error'
      summary: Create subscription
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      description: Updates an existing subscription with the provided data.
      parameters:
      - description: Subscription update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Subscribe'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid input or date format
          schema:
            $ref: '#/definitions/handlers.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.Error'
      summary: Update subscription
      tags:
      - subscriptions
swagger: "2.0"
